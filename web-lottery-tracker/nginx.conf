server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # --- Security headers ---
  # Kept in a snippet because nginx discards inherited add_header directives
  # in any location that adds its own header; every such location re-includes it.
  include /etc/nginx/snippets/security-headers.conf;

  # --- Cache rules: hashed assets are immutable, HTML is revalidated ---
  location ~* \.(?:js|css|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every client-side route serves the shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  # Source archives are for the Rork-hosted site only, never the container.
  location ^~ /downloads/ {
    return 404;
  }

  # Never serve dotfiles (except .well-known).
  location ~ /\.(?!well-known) {
    deny all;
  }

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
