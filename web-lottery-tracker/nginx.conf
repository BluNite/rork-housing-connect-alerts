server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # --- Security headers (header duplicates and overrides the index.html meta) ---
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.rork.app https://*.rork.live; connect-src 'self' https://dwtwixltasvnkmsortqx.supabase.co wss://dwtwixltasvnkmsortqx.supabase.co https://a806-housingconnectapi.nyc.gov" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # --- Cache rules: hashed assets are immutable, HTML is revalidated ---
  location ~* \.(?:js|css|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every client-side route serves the shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  # Never serve dotfiles or the source maps of the deployed bundle.
  location ~ /\.(?!well-known) {
    deny all;
  }

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
