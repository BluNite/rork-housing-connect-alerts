# Included in the server block AND every location that sets its own header.
# nginx drops inherited add_header directives as soon as a location defines
# any add_header of its own, so these must be re-included per location.
# Ad origins exist only for the consent-gated, non-personalized AdSense unit
# (AdSlot.tsx). Keep this list identical to the CSP meta tag in index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-oi2+FgAIgiRg7GzCabHyvq73MspjzQ2In240rR8QG6w=' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'none'; frame-src https://googleads.g.doubleclick.net https://*.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.rork.app https://*.rork.live; connect-src 'self' https://dwtwixltasvnkmsortqx.supabase.co wss://dwtwixltasvnkmsortqx.supabase.co https://a806-housingconnectapi.nyc.gov https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.adtrafficquality.google" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
