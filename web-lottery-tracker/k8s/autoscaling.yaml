# Scale 2 -> 6 pods on CPU, and never let voluntary disruptions
# (node upgrades, drains) take the site below one running pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lottery-tracker-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lottery-tracker-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lottery-tracker-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lottery-tracker-web
