# Internal-only service. Public traffic enters through the Ingress (TLS).
apiVersion: v1
kind: Service
metadata:
  name: lottery-tracker-web
  labels:
    app.kubernetes.io/name: lottery-tracker-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lottery-tracker-web
  ports:
    - name: http
      port: 80
      targetPort: http
