name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web-lottery-tracker
        run: bun install --frozen-lockfile

      # Build with the repository base path so assets and routing resolve
      # under https://<user>.github.io/<repo>/
      - name: Build
        working-directory: web-lottery-tracker
        run: bun run build -- --base=/${{ github.event.repository.name }}/

      # SPA fallback: GitHub Pages serves 404.html for unknown paths,
      # so client-side routes like /account survive a refresh.
      - name: Add SPA fallback
        run: cp web-lottery-tracker/dist/index.html web-lottery-tracker/dist/404.html

      - name: Disable Jekyll processing
        run: touch web-lottery-tracker/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-lottery-tracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
