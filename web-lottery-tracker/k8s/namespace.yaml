# Dedicated namespace with the strictest built-in Pod Security level.
# The API server rejects any pod here that runs as root, can escalate
# privileges, keeps Linux capabilities, or skips the seccomp profile.
apiVersion: v1
kind: Namespace
metadata:
  name: lottery-tracker
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
